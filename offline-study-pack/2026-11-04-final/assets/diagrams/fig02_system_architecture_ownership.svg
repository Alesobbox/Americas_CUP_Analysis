  <line x1="510" y1="500" x2="548" y2="480" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="736" y1="165" x2="772" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
