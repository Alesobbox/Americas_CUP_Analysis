<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#1a73e8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0d9488"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowNavy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#f8fafc" rx="10" stroke="#cbd5e1"/>
  <text x="28" y="36" font-size="18" font-weight="700" fill="#0f172a">Figure 1.1 — AC40 Windward–Leeward Course Geometry &amp; Velocity Decomposition</text>
  <text x="28" y="56" font-size="12.5" fill="#475569">Left: Multi-leg course layout, boundaries, gates, tacks, and gybes. Right: Heading, COG, TWA, Course VMG vs. Wind VMG.</text>

  <!-- Left panel: Course schematic -->
  <rect x="28" y="72" width="460" height="520" fill="#eff6ff" rx="8" stroke="#93c5fd"/>
  <!-- Safety boundary -->
  <polygon points="55,105 460,95 470,565 50,555" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="64" y="122" font-size="11" fill="#64748b" font-weight="600">Safety Boundary Polygon (course.boundaries.safety)</text>
  <!-- Active race boundary -->
  <polygon points="85,135 430,128 438,530 80,522" fill="#dbeafe" fill-opacity="0.45" stroke="#2563eb" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="96" y="152" font-size="11" fill="#1d4ed8" font-weight="600">Active Race Boundary (course.boundaries.race)</text>

  <!-- Wind vector at top -->
  <line x1="258" y1="84" x2="258" y2="142" stroke="#0284c7" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="238" y1="84" x2="238" y2="132" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="278" y1="84" x2="278" y2="132" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="180" y="76" width="156" height="22" rx="4" fill="#ffffff" stroke="#0284c7"/>
  <text x="258" y="91" font-size="11" font-weight="700" fill="#0369a1" text-anchor="middle">True Wind (TWD = FROM)</text>

  <!-- Course axis centerline -->
  <line x1="258" y1="490" x2="258" y2="175" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowNavy)"/>
  <text x="266" y="330" font-size="11" fill="#334155" font-weight="600">Course Axis (θ_axis)</text>

  <!-- Top / Windward Gate -->
  <line x1="198" y1="185" x2="318" y2="185" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="5,3"/>
  <circle cx="198" cy="185" r="7" fill="#ea580c" stroke="#fff" stroke-width="2"/>
  <circle cx="318" cy="185" r="7" fill="#ea580c" stroke="#fff" stroke-width="2"/>
  <text x="185" y="175" font-size="11" font-weight="700" fill="#9a3412" text-anchor="end">Top Gate Port</text>
  <text x="330" y="175" font-size="11" font-weight="700" fill="#9a3412">Top Gate Stbd</text>
  <text x="258" y="202" font-size="11" fill="#9a3412" text-anchor="middle">Sequence 1 &amp; 3 (TOP)</text>

  <!-- Bottom / Leeward Gate -->
  <line x1="198" y1="445" x2="318" y2="445" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="5,3"/>
  <circle cx="198" cy="445" r="7" fill="#0d9488" stroke="#fff" stroke-width="2"/>
  <circle cx="318" cy="445" r="7" fill="#0d9488" stroke="#fff" stroke-width="2"/>
  <text x="185" y="448" font-size="11" font-weight="700" fill="#115e59" text-anchor="end">Bottom Port</text>
  <text x="330" y="448" font-size="11" font-weight="700" fill="#115e59">Bottom Stbd</text>

  <!-- Start / Finish Line (Sequence 0) -->
  <line x1="170" y1="495" x2="346" y2="495" stroke="#dc2626" stroke-width="3"/>
  <circle cx="170" cy="495" r="8" fill="#dc2626" stroke="#fff" stroke-width="2"/>
  <circle cx="346" cy="495" r="8" fill="#dc2626" stroke="#fff" stroke-width="2"/>
  <text x="160" y="512" font-size="11" font-weight="700" fill="#991b1b" text-anchor="end">Port Mark (s=0)</text>
  <text x="356" y="512" font-size="11" font-weight="700" fill="#991b1b">Stbd Mark (s=1)</text>
  <text x="258" y="514" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Start Line (Seq 0)</text>

  <!-- Upwind Track (Odd Leg: Zigzag Tacking) -->
  <polyline points="220,495 140,395 335,280 205,185" fill="none" stroke="#1a73e8" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <circle cx="140" cy="395" r="5" fill="#1a73e8"/>
  <text x="132" y="392" font-size="11" font-weight="700" fill="#1e40af" text-anchor="end">Tack 1 (Bow thru wind)</text>
  <circle cx="335" cy="280" r="5" fill="#1a73e8"/>
  <text x="345" y="284" font-size="11" font-weight="700" fill="#1e40af">Tack 2</text>
  <text x="160" y="450" font-size="11" font-weight="700" fill="#1e40af">Upwind (Odd Legs)</text>

  <!-- Downwind Track (Even Leg: Gybing) -->
  <polyline points="318,185 395,310 185,410 210,445" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowOrange)"/>
  <circle cx="395" cy="310" r="5" fill="#ea580c"/>
  <text x="402" y="314" font-size="11" font-weight="700" fill="#9a3412">Gybe (Stern thru wind)</text>
  <text x="366" y="242" font-size="11" font-weight="700" fill="#9a3412">Downwind (Even)</text>

  <!-- Right Panel: Vector Decomposition & Bow Offset -->
  <rect x="508" y="72" width="424" height="310" fill="#ffffff" rx="8" stroke="#cbd5e1"/>
  <text x="526" y="98" font-size="14" font-weight="700" fill="#0f172a">Vector Decomposition at Instant t</text>

  <!-- Coordinate axes in right panel -->
  <line x1="690" y1="330" x2="690" y2="115" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowNavy)"/>
  <text x="690" y="108" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">North (0°) / Leg Axis θ_leg</text>

  <!-- Shifted True Wind Direction -->
  <line x1="635" y1="125" x2="690" y2="250" stroke="#0284c7" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="615" y="122" font-size="11" font-weight="700" fill="#0369a1" text-anchor="middle">TWD (Wind From)</text>

  <!-- Boat Hull centered at (690, 250) rotated by Heading = 38 deg -->
  <g transform="translate(690,250) rotate(38)">
    <polygon points="0,-55 12,-20 12,10 -12,10 -12,-20" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
    <circle cx="0" cy="8" r="4" fill="#dc2626"/>
    <circle cx="0" cy="-55" r="4" fill="#16a34a"/>
  </g>
  <text x="645" y="268" font-size="11" font-weight="700" fill="#dc2626" text-anchor="end">GNSS Transom (x,y)</text>
  <text x="738" y="205" font-size="11" font-weight="700" fill="#16a34a">Bow (+12.963 m along Heading ψ)</text>

  <!-- Velocity Vector SOG along COG = 45 deg -->
  <line x1="690" y1="250" x2="805" y2="135" stroke="#0d9488" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="812" y="138" font-size="12" font-weight="700" fill="#0f766e">SOG along COG</text>

  <!-- Projection onto Leg Axis: Course VMG -->
  <line x1="805" y1="135" x2="690" y2="135" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="690" y1="250" x2="690" y2="135" stroke="#1a73e8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="680" y="175" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="end">Course VMG = SOG·cos(COG − θ_leg)</text>

  <!-- Bottom Right Panel: Key Distinctions Box -->
  <rect x="508" y="396" width="424" height="196" fill="#ffffff" rx="8" stroke="#cbd5e1"/>
  <text x="526" y="422" font-size="14" font-weight="700" fill="#0f172a">Three Distinct VMG Definitions in This Repository</text>
  <text x="526" y="446" font-size="12" fill="#1e293b"><tspan font-weight="700" fill="#1d4ed8">1. Replay Fixed-Axis VMG (`telemetry.boats[id].vmg`):</tspan></text>
  <text x="538" y="464" font-size="11.5" fill="#475569">SOG · cos(COG − course.axis_deg). Positive upwind, negative downwind.</text>
  <text x="526" y="490" font-size="12" fill="#1e293b"><tspan font-weight="700" fill="#0f766e">2. Historical Leg-Directed Course VMG (`course_vmg_mean_kt`):</tspan></text>
  <text x="538" y="508" font-size="11.5" fill="#475569">SOG · cos(COG − θ_leg), where θ_leg = axis (odd) or axis+180° (even).</text>
  <text x="526" y="534" font-size="12" fill="#1e293b"><tspan font-weight="700" fill="#ea580c">3. Historical Wind-Relative VMG (`wind_vmg_upwind/downwind`):</tspan></text>
  <text x="538" y="552" font-size="11.5" fill="#475569">+SOG · cos(COG − TWD_boat) upwind; −SOG · cos(COG − TWD_boat) downwind.</text>
  <text x="526" y="578" font-size="11.5" font-weight="600" fill="#b91c1c">Key rule: Never average signed fixed-axis VMG across a full race!</text>
</svg>