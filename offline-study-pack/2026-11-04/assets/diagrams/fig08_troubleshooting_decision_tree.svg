<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ad" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#f8fafc" rx="10" stroke="#cbd5e1"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#0f172a">Figure 8.1 — Offline Operations &amp; Diagnostic Troubleshooting Decision Tree</text>
  <text x="24" y="54" font-size="12.5" fill="#475569">Rapid diagnostic routing for display issues, missing metrics, null probabilities, and custom scenario errors.</text>

  <!-- Root node -->
  <rect x="350" y="70" width="260" height="44" rx="6" fill="#1e293b" stroke="#0f172a"/>
  <text x="480" y="97" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">What symptom are you observing?</text>

  <!-- 4 Branches -->
  <line x1="390" y1="114" x2="135" y2="154" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/>
  <line x1="450" y1="114" x2="365" y2="154" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/>
  <line x1="510" y1="114" x2="595" y2="154" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/>
  <line x1="570" y1="114" x2="825" y2="154" stroke="#334155" stroke-width="2" marker-end="url(#ad)"/>

  <!-- Branch 1: Blank Map / Offline -->
  <rect x="24" y="158" width="220" height="336" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="134" y="182" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="middle">1. Map / Course Display Issue</text>
  <text x="36" y="206" font-size="11" font-weight="700" fill="#0f172a">Q: Are map tiles blank offline?</text>
  <text x="36" y="222" font-size="10.5" fill="#334155">→ Switch toolbar to <tspan font-weight="700">Grid</tspan> mode.</text>
  <text x="36" y="237" font-size="10.5" fill="#334155">  Grid renders 100% locally via</text>
  <text x="36" y="252" font-size="10.5" fill="#334155">  `StaticCourseLayer.ts` (0 tile reqs).</text>

  <text x="36" y="280" font-size="11" font-weight="700" fill="#0f172a">Q: Are boats tiny (1 px) at zoom?</text>
  <text x="36" y="296" font-size="10.5" fill="#334155">→ Switch scale from <tspan font-weight="700">True</tspan> to</text>
  <text x="36" y="311" font-size="10.5" fill="#334155">  <tspan font-weight="700">Enhanced</tspan> (`minPx=30` AC40).</text>

  <text x="36" y="339" font-size="11" font-weight="700" fill="#0f172a">Q: Missing boat trails?</text>
  <text x="36" y="355" font-size="10.5" fill="#334155">→ Check Trail filter (`All`,</text>
  <text x="36" y="370" font-size="10.5" fill="#334155">  `Highlighted`, `None`) &amp; Boat</text>
  <text x="36" y="385" font-size="10.5" fill="#334155">  visibility filter pills.</text>

  <text x="36" y="413" font-size="11" font-weight="700" fill="#0f172a">Q: Opening `dist/index.html` via</text>
  <text x="36" y="428" font-size="11" font-weight="700" fill="#0f172a">`file://` fails with CORS?</text>
  <text x="36" y="444" font-size="10.5" fill="#334155">→ Study Pack HTMLs work on `file://`.</text>
  <text x="36" y="459" font-size="10.5" fill="#334155">  For the React app, run:</text>
  <text x="36" y="474" font-size="10" font-family="Consolas, monospace" fill="#1e40af">  python serve_offline_dashboard.py</text>

  <!-- Branch 2: Null / Missing Historical Metric -->
  <rect x="254" y="158" width="220" height="336" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="364" y="182" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">2. Metric or Radar Axis is Null</text>
  <text x="266" y="206" font-size="11" font-weight="700" fill="#0f172a">Q: Why is a scalar or axis `—`?</text>
  <text x="266" y="222" font-size="10.5" fill="#334155">→ Check `unavailable_reason`:</text>
  <text x="266" y="238" font-size="10.5" fill="#334155">1. `source_conflict` (e.g. USA PR1</text>
  <text x="266" y="253" font-size="10.5" fill="#334155">   nested `started=false`).</text>
  <text x="266" y="268" font-size="10.5" fill="#334155">2. `insufficient_coverage` (&lt;95%</text>
  <text x="266" y="283" font-size="10.5" fill="#334155">   valid samples due to &gt;2.0s gap,</text>
  <text x="266" y="298" font-size="10.5" fill="#334155">   e.g. NZL G Leg 4 in PR1).</text>
  <text x="266" y="313" font-size="10.5" fill="#334155">3. `no_qualifying_events` (zero</text>
  <text x="266" y="328" font-size="10.5" fill="#334155">   clean tacks/gybes with full</text>
  <text x="266" y="343" font-size="10.5" fill="#334155">   [-6.5s, +6.0s] source coverage).</text>

  <text x="266" y="371" font-size="11" font-weight="700" fill="#0f172a">Q: Why is `overall_index` null</text>
  <text x="266" y="386" font-size="11" font-weight="700" fill="#0f172a">when 5 of 6 axes exist?</text>
  <text x="266" y="402" font-size="10.5" fill="#334155">→ `overall_index` requires all 6</text>
  <text x="266" y="417" font-size="10.5" fill="#334155">  dimensions; missing axes are</text>
  <text x="266" y="432" font-size="10.5" fill="#334155">  never imputed or dropped.</text>

  <text x="266" y="458" font-size="11" font-weight="700" fill="#0f172a">Q: 5-min wind projection `—`?</text>
  <text x="266" y="474" font-size="10.5" fill="#334155">→ 0 / 3,455 windows pass stability!</text>

  <!-- Branch 3: Forecast Win/Place Null or Unchanged -->
  <rect x="484" y="158" width="220" height="336" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
  <text x="594" y="182" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">3. Forecast Value Question</text>
  <text x="496" y="206" font-size="11" font-weight="700" fill="#0f172a">Q: Why is Cup win % an interval</text>
  <text x="496" y="221" font-size="11" font-weight="700" fill="#0f172a">(e.g. 13.9%–48.4%) not a point?</text>
  <text x="496" y="237" font-size="10.5" fill="#334155">→ 34.46% of baseline trials hit an</text>
  <text x="496" y="252" font-size="10.5" fill="#334155">  unresolved 6-Challenger seeding</text>
  <text x="496" y="267" font-size="10.5" fill="#334155">  tie (RRSAC 102.1). Point</text>
  <text x="496" y="282" font-size="10.5" fill="#334155">  probabilities are strictly null.</text>

  <text x="496" y="310" font-size="11" font-weight="700" fill="#0f172a">Q: Why does 12 kt vs 13 kt give</text>
  <text x="496" y="325" font-size="11" font-weight="700" fill="#0f172a">the same expected positions?</text>
  <text x="496" y="341" font-size="10.5" fill="#334155">→ Current promoted model retains</text>
  <text x="496" y="356" font-size="10.5" fill="#334155">  the conservative zero-effect</text>
  <text x="496" y="371" font-size="10.5" fill="#334155">  wind reference (`beta_wind = 0`).</text>

  <text x="496" y="399" font-size="11" font-weight="700" fill="#0f172a">Q: Why does 17° direction offset</text>
  <text x="496" y="414" font-size="11" font-weight="700" fill="#0f172a">refuse to generate?</text>
  <text x="496" y="430" font-size="10.5" fill="#334155">→ Direction-response is unvalidated.</text>
  <text x="496" y="445" font-size="10.5" fill="#334155">  Only `0°` offset is supported;</text>
  <text x="496" y="460" font-size="10.5" fill="#334155">  click `Use 0° offset`.</text>

  <!-- Branch 4: Custom Scenario Generation / Lock -->
  <rect x="714" y="158" width="222" height="336" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
  <text x="825" y="182" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">4. Custom Scenario &amp; Build Errors</text>
  <text x="726" y="206" font-size="11" font-weight="700" fill="#0f172a">Q: `/api/forecast-scenarios` 404?</text>
  <text x="726" y="222" font-size="10.5" fill="#334155">→ Static server cannot run Python.</text>
  <text x="726" y="237" font-size="10.5" fill="#334155">  Must run `npm run dev` or `vite`</text>
  <text x="726" y="252" font-size="10.5" fill="#334155">  with `.venv` and `.forecast/`.</text>

  <text x="726" y="280" font-size="11" font-weight="700" fill="#0f172a">Q: Scenario generation locked?</text>
  <text x="726" y="296" font-size="10.5" fill="#334155">→ Check `.forecast/publish.lock`.</text>
  <text x="726" y="311" font-size="10.5" fill="#334155">  If owner &amp; child PIDs have exited,</text>
  <text x="726" y="326" font-size="10.5" fill="#334155">  middleware auto-recovers lock;</text>
  <text x="726" y="341" font-size="10.5" fill="#334155">  10-min watchdog kills hung jobs.</text>

  <text x="726" y="369" font-size="11" font-weight="700" fill="#0f172a">Q: Hash mismatch in browser?</text>
  <text x="726" y="385" font-size="10.5" fill="#334155">→ Run `python -m pipeline.prediction`</text>
  <text x="726" y="400" font-size="10.5" fill="#334155">  `verify` and `scripts/`</text>
  <text x="726" y="415" font-size="10.5" fill="#334155">  `build_artifact_inventory.py`.</text>

  <text x="726" y="443" font-size="11" font-weight="700" fill="#0f172a">Q: Why 9 boats in Forecast vs 8</text>
  <text x="726" y="458" font-size="11" font-weight="700" fill="#0f172a">in Replay (`26_09_22_nap_ipr_pr2`)?</text>
  <text x="726" y="474" font-size="10.5" fill="#334155">→ GBR B is scheduled (227) w/ 0 track.</text>
</svg>