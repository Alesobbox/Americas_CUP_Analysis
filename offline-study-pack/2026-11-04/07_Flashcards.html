<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline flashcards</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f3;color:#172d36;font:17px/1.65 system-ui,sans-serif}header,main{max-width:980px;margin:auto;padding:26px}header{background:#153c4a;color:white}header a{color:#d0eeed}nav{position:sticky;top:0;background:#fff;padding:12px;z-index:5;border-bottom:1px solid #b8c8cd}nav a{margin-right:16px}input{padding:10px;min-width:220px;font:inherit}article{background:white;padding:30px;margin-bottom:24px}h1{font-size:2em}h2{font-size:1.6em;margin-top:1.7em;line-height:1.3}h3{font-size:1.17em;color:#256272;margin-top:1.5em}p{margin:0 0 1em}a{color:#145c7c;overflow-wrap:anywhere}code{font:0.87em/1.5 Consolas,monospace;background:#f0f3f4;overflow-wrap:anywhere}pre{white-space:pre-wrap;background:#f0f3f4;padding:16px;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font-size:.86em;display:block;overflow-x:auto;margin:20px 0}th,td{border:1px solid #ccd7db;padding:10px;vertical-align:top}th{background:#e4eff0;text-align:left}img{max-width:100%;height:auto}figure{margin:22px 0}figcaption{font-size:.9em;color:#405b66}li{margin-bottom:.5em}.toc{columns:2;column-gap:30px}.line{display:block;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 Consolas,monospace}.line:target{background:#fff0b0}.num{display:inline-block;width:4.5em;color:#607880}.note{padding:16px;background:#e8f2f2;border-left:4px solid #29808d}button{padding:12px;font:inherit;cursor:pointer}#search-status{margin-left:12px}.hidden{display:none}@media(max-width:650px){main,header{padding:16px}article{padding:18px}.toc{columns:1}table{font-size:.82em}}@media print{nav{display:none}body{background:white}article{padding:0}h2{break-before:page}a{color:inherit}}</style><header><h1>Offline flashcards</h1><a href="START_HERE.html">Study pack home</a></header><nav><a href="#contents">Contents</a></nav><main><article><h2>Offline flashcards</h2><p>60 cards. Think first, reveal reasoning, then advance. No data leaves this page.</p><p id="count"></p><h3 id="front"></h3><div id="back" hidden></div><p><button id="show">Reveal answer</button> <button id="prev">Previous</button> <button id="next">Next</button></p></article></main><script>document.querySelector('#search')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();let n=0;document.querySelectorAll('article').forEach(a=>{const show=!q||a.textContent.toLowerCase().includes(q);a.hidden=!show;if(show)n++});document.querySelector('#search-status').textContent=q?n+' sections match':''});</script></html><script>const cards=[{"id": "1", "topic": "1 Units and dimensions", "front": "Synthetic. Convert 10 m/s to knots and explain why a VMG cannot be added directly to a duration.", "back": "One knot is 1852/3600 m/s, so 10 \u00d7 3600/1852 = 19.4384449 kt. VMG is length/time while duration is time. Adding them has no physical meaning; multiplying compatible speed and time gives distance. The code uses a finite conversion coefficient, so last decimals can reflect that convention."}, {"id": "2", "topic": "2 Reading the archive", "front": "Actual repository evidence. What do 28 sessions, 224 replayed boat-races and 227 scheduled entries count? Why are 19,488 PR1 frames not 19,488 independent winner observations?", "back": "A session is one exported source race/session, a boat-race is one boat observed in one session, and scheduled entries count the complete scheduled fields. Three scheduled observations have no replay telemetry. PR1 frames are repeated measurements of the same evolving race. They share one winner and common conditions. Counting each as an independent outcome creates pseudoreplication."}, {"id": "3", "topic": "3 Speed and progress", "front": "Synthetic. Two boats both sail at 20 kt; their velocities make 30\u00b0 and 60\u00b0 with the positive course axis. Calculate course-axis VMG. Can you rank their intrinsic abilities?", "back": "VMG is the dot product with a unit course direction: 20 cos30\u00b0 = 17.3205 kt, versus 20 cos60\u00b0 = 10 kt. The first currently makes more progress along that axis. This says nothing sufficient about intrinsic ability: leg direction, position, wind, selected maneuver and course constraints differ. Heading is not necessarily velocity direction."}, {"id": "4", "topic": "4 Missing is not zero", "front": "Actual behavior interpreted through a synthetic scenario. A retired boat has unavailable SOG mean; a second boat has 0 kt over a valid observed window. How should a comparison handle them?", "back": "Unavailable means the defined quantity lacks an eligible window or support; zero means the defined eligible observations yield zero speed. Preserve null and its reason for the retired boat. Do not insert zero into the peer mean or CSV. The second value can be descriptive if the source and window really support it, although performance ratio eligibility can require positive peer values."}, {"id": "5", "topic": "5 Evidence ladder", "front": "Conceptual, based on actual contracts. Classify GNSS position, regular-grid halfway position, gate crossing time, expected finish and an AC75 transfer loading.", "back": "GNSS position is a source observation subject to sensor limitations. The regular-grid halfway position is interpolated. Crossing time is reconstructed from geometry/source timing. Expected finish is a model expectation conditional on inputs and conventions. A transfer loading is an assumption varied by scenario, not a measured cross-class correlation. Availability and provenance should travel with each field."}, {"id": "6", "topic": "6 A result is not a ruling", "front": "Actual repository interpretation. A displayed Keep Clear overlap occurs. What can you defend?", "back": "Under the chosen yacht polygons, heading, position interpolation and tolerance, geometric envelopes overlap. You cannot infer an official penalty, right of way, fault, collision damage or the umpire decision. Sensor error and time sampling also matter. The physical contact computation is separate from enhanced on-screen display size."}, {"id": "7", "topic": "7 Angular wraparound", "front": "Synthetic. Interpolate halfway between 350\u00b0 and 10\u00b0. Derive the signed shortest angular change.", "back": "The signed delta is ((10 - 350 + 180) mod 360) - 180 = 20\u00b0. The midpoint is (350 + 0.5\u00d720) mod360 = 0\u00b0. Arithmetic averaging gives 180\u00b0, pointing in the opposite direction. At exactly 180\u00b0 a tie convention is required; do not assume the data can identify which path was physically taken."}, {"id": "8", "topic": "8 Projection", "front": "Synthetic using Naples coefficients. Latitude increases by 0.001\u00b0 and longitude by 0.002\u00b0. Find east/north offsets.", "back": "With K_lon=84374.839 m/degree and K_lat=111047.746 m/degree, x=168.749678 m east and y=111.047746 m north. This is a local metric approximation around the race origin, not degrees interpreted as metres. Moving to another venue requires its origin and coefficients; a filename is not a projection definition."}, {"id": "9", "topic": "9 Crossing fractions", "front": "Synthetic. Boat moves from (-2,0) to (2,0) in one second. Gate goes from (0,-5) to (0,5). Calculate path and gate parameters and crossing time.", "back": "Write boat position (-2,0)+t(4,0) and gate position (0,-5)+u(0,10). Equality yields t=0.5 and u=0.5, so crossing is halfway through the second and the line. This strict stationary-segment example omits the repository endpoint tolerance, sampled moving marks and event separation logic."}, {"id": "10", "topic": "10 Gate tolerance", "front": "Actual code parameter, synthetic gate. A 100 m gate accepts line parameter u in [-0.20,1.20]. What physical extension does that permit?", "back": "Parameter u is dimensionless. Extending from 0 to -0.20 is 20% of the gate length, or 20 m beyond one endpoint; 1 to1.20 is 20 m beyond the other. It is not 0.20 m. Consequences should be tested near endpoints, especially when marks move or position uncertainty is large."}, {"id": "11", "topic": "11 Smooth missingness", "front": "Synthetic. Two source positions are 10 seconds apart; replay shows 100 ms steps between them. Does the historical 2-second support threshold pass?", "back": "No. Resampling creates a regular visual path but does not insert independent source observations. The original gap exceeds the historical coverage threshold. A historical metric can remain unavailable even when the replay looks continuous. Inspect source timestamps and coverage metadata rather than counting regularized frames."}, {"id": "12", "topic": "12 Publication clocks", "front": "Synthetic causal scenario. A weather observation is at 09:55, issued at 10:05, and the forecast is for 10:00. Can it be used?", "back": "No: although its observation precedes 10:00, it was unavailable to the predictor until 10:05. Information availability must precede the prediction cutoff. A historical reanalysis downloaded later also cannot be silently treated as a contemporaneously issued forecast. Store and check distinct observation, issue and available-at times."}, {"id": "13", "topic": "13 Mean of leg ratios", "front": "Synthetic. Selected speeds are 20 and30 kt; eligible peer means are10 and30 kt. Find the performance index and compare the ratio of aggregate means.", "back": "Leg indexes are100\u00d720/10=200 and100\u00d730/30=100. Equal leg weighting gives150. Aggregate selected mean is25 and peer mean20, giving125. The published definition averages leg ratios; calculating125 in the browser would change the definition. It is possible for both raw aggregate labels and index150 to be correct."}, {"id": "14", "topic": "14 Excluding yourself", "front": "Synthetic. Boat A=20 kt, B=10 kt, C=30 kt on one eligible leg. Compute A and B indexes.", "back": "A peers B,C have mean20, so index100. B peers A,C have mean25, so index40. Each boat has a different leave-one-out baseline. A baseline including A would be20 here by coincidence, but including B would give20 and index50, a different result. Equal votes are per eligible peer boat, not per telemetry frame."}, {"id": "15", "topic": "15 Coverage threshold", "front": "Actual rule, synthetic observations. In a100 s completed leg, selected coverage is95 s; peer coverage is94.99 s. Should this peer comparison be admitted?", "back": "The selected boat reaches95%, but the peer misses the95% threshold. Exclude that peer for that leg. Do not round94.99 to95 before eligibility. If no eligible peer remains, the dimension can be unavailable, not zero or an invented100. The tests explicitly protect this boundary."}, {"id": "16", "topic": "16 Retention weights", "front": "Synthetic. Selected event retentions are80 and80%. Peer B has two50% events; peer C has one85% event on the matched leg. Find the equal-boat peer mean and index.", "back": "Selected mean is80%. Peer B contributes its mean50% once and C contributes85% once, so peer mean67.5%. Index100\u00d780/67.5=118.5185. Pooling all peer events gives61.6667%, incorrectly letting B vote twice. Actual eligibility additionally checks event type, whole source-supported search windows, completed leg and ambiguity."}, {"id": "17", "topic": "17 A six axis profile", "front": "Actual case. ITA B in naples_mr_final has six available dimensions, four comparable legs of six and847.085 covered seconds. What does six-axis completeness establish?", "back": "It establishes that each of the six definitions has at least sufficient eligible evidence for an index under its own rule. It does not establish full-course coverage, all legs, equal precision per dimension or a complete history. Report the4/6 support and inspect excluded crossings. The source timing audit does not justify inventing the missing endpoints."}, {"id": "18", "topic": "18 The meaning of110", "front": "Conceptual, actual index definition. Explain an index110 without saying the boat is10% more talented or will win10% more often.", "back": "It means the equal-weight average of eligible same-leg selected/other-boat ratios, multiplied by100, is110 for that dimension and scope. For speed dimensions, this is a10% average relative difference under that weighting. It is descriptive, peer-dependent and conditional on selected complete supported legs. It is not a causal crew effect, intrinsic ability, full-course guarantee, uncertainty interval or calibrated probability."}, {"id": "19", "topic": "19 Plackett Luce first choice", "front": "Synthetic. Strengths are2,1,1. Find the first boat win probability and probability of order A,B,C.", "back": "First choice A has probability2/(2+1+1)=0.5. Given A first, B has1/(1+1)=0.5. The complete order probability is0.5\u00d70.5\u00d71=0.25. This simple ranking example assumes positive relative weights and no nonfinish complication; it does not reproduce the correlated race simulator."}, {"id": "20", "topic": "20 Expected position with nonfinish", "front": "Synthetic. Four scheduled boats. A has unconditional finish-position masses0.2,0.3,0.1,0 and nonfinish mass0.4, scored at N=4. Find expectation.", "back": "E[position]=1\u00d70.2+2\u00d70.3+3\u00d70.1+4\u00d70+4\u00d70.4=2.7. Conditioning on finishing instead would give(0.2+0.6+0.3)/0.6=1.8333. The published scheduled-field convention includes nonfinish; silently conditioning would improve the apparent number by changing the target. Multiple nonfinishers can tie at N, so summed expectations need not obey rank-sum conservation."}, {"id": "21", "topic": "21 Proper scoring", "front": "Synthetic. Forecast(0.7,0.2,0.1), winner C. Calculate summed multiclass Brier and log loss.", "back": "Brier=(0.7-0)\u00b2+(0.2-0)\u00b2+(0.1-1)\u00b2=0.49+0.04+0.81=1.34. Log loss=-ln0.1=2.302585. These penalize confident error. State the summed multiclass convention because other sources average components. One outcome cannot establish calibration; a valid10% event can occur."}, {"id": "22", "topic": "22 Correlated differences", "front": "Synthetic. Two race-time errors each have variance4 s\u00b2 and correlation0.75. Find the variance of their difference; compare independence.", "back": "Var(TA-TB)=4+4-2\u00d70.75\u00d72\u00d72=2 s\u00b2. Under independence it would be8 s\u00b2. Shared environmental effects can cancel in pairwise differences. This alone does not specify the full simulator or imply all correlations are positive; it illustrates why independently perturbing each boat changes rank uncertainty."}, {"id": "23", "topic": "23 Persistent series strength", "front": "Synthetic. A fair latent coin selects match probability0.8 or0.2 once for a two-race series. Find marginal win probability and probability of two wins.", "back": "Marginal win probability is0.5\u00d70.8+0.5\u00d70.2=0.5. Two wins have probability0.5\u00d70.8\u00b2+0.5\u00d70.2\u00b2=0.34. Replacing the persistent latent variable with independent marginal0.5 wins gives0.25. Learning and dependence across races matter even when marginals match. Re-sampling all uncertainty per match can make a series overconfident or structurally different."}, {"id": "24", "topic": "24 Unresolved path bounds", "front": "Synthetic.100 trials: A wins40 resolved, B25, C15, and20 paths are unresolved. Derive team bounds and explain their sums.", "back": "A=[0.40,0.60], B=[0.25,0.45], C=[0.15,0.35]. Lower endpoints sum0.80; uppers1.40. Each upper assigns all unresolved mass to that team separately. The endpoints describe different completions of uncertainty and cannot jointly be a probability vector. Renormalizing changes the question and fabricates an allocation unsupported by the rules."}, {"id": "25", "topic": "25 Monte Carlo versus structure", "front": "Actual budget with synthetic error calculation. What is worst-case95% binomial half-width at5,000 independent trials, and why does it not fix34.46% unresolved paths?", "back": "1.96\u221a(0.5\u00d70.5/5000)=0.013859, or1.386 percentage points. This approximates numerical sampling error in a specified event probability conditional on the model. The34.46% unresolved mass comes from missing path resolution rules. More draws estimate that mass more precisely without deciding how to allocate it. A structural bound and a Monte Carlo interval measure different things."}, {"id": "26", "topic": "26 Same wind predictions", "front": "Actual behavior. Supported12,13 and13.25 kt scenarios give the same expected positions. Is this necessarily a cache bug? What would you inspect?", "back": "No. The current conservative wind reference has zero learned effect, so distinct supported input hashes may yield equal expectations. Inspect exact requested conditions, immutable path/model references and support status before blaming caching. If an old input is displayed under new conditions that is a stale-result issue; equal valid outputs alone do not establish it. Nonzero direction offsets remain unsupported."}, {"id": "27", "topic": "27 Stale asynchronous result", "front": "Synthetic interface scenario. You select race A, then B, and A loads last. What invariant prevents B displaying A evidence?", "back": "The consumer must accept a response only when its request/race identity still matches the current selection, commonly with effect cleanup or an identity token. Clearing stale display state matters too. The current UI has several independent loading paths, so trace the specific component and artifact rather than assuming one global cache solves every race. Historical values remain producer-owned."}, {"id": "28", "topic": "28 Hash mismatch", "front": "Actual canonical contract, synthetic file. A JSON object is written canonically plus newline. Its byte SHA differs from canonical content SHA. Is it corrupted?", "back": "Not necessarily. Forecast content hashing sorts keys, uses compact separators and excludes the disk trailing newline; a byte hash covers the newline. Recompute according to the owning contract. The study manifest intentionally hashes actual bytes. A source reference also needs scope and current-file checks; matching metadata strings alone is insufficient."}, {"id": "29", "topic": "29 Offline backend", "front": "Conceptual operational scenario. The study HTML opens locally, but Generate forecast does nothing because there is no server. What was confused?", "back": "Reading the study pack needs only a browser/PDF viewer. An application forecast request needs a local server/API plus prepared Python environment and feature dataset. A static publication can display existing objects but cannot execute a Python generator. Use the saved evidence to study; prepare and test the optional dashboard/backend before leaving if generation is required."}, {"id": "30", "topic": "30 An apparent event", "front": "Synthetic scenario grounded in current interpolation behavior. A straight interpolated track crosses a gate during a10-second GNSS gap. How would you describe it?", "back": "The reconstructed or visual path intersects the modeled line, but no direct source position inside the gap confirms the exact event. Check mark motion, endpoint tolerance, source crossing evidence, leg sequence and coverage status. Do not call it an official crossing or use smooth frames as ten independent observations. Sensitivity or an unavailable interval is more honest than false precision."}, {"id": "31", "topic": "31 Rank expectation identity", "front": "Synthetic derivation. For a complete ranking without nonfinish ties, derive E[rank_i] =1 + sum over j\u2260i P(j ahead of i). Why does the published nonfinish convention need care?", "back": "Rank_i=1+\u03a3 I(j ahead of i), pointwise, so linearity gives the expectation identity without requiring independent pairwise events. With all nonfinishers scored at N, tied nonfinish scores are not necessarily one plus strict ahead count. Use the actual simulated score convention rather than importing complete-permutation identities. Linearity is general; the representation of rank is conditional."}, {"id": "32", "topic": "32 Weighting evidence", "front": "Synthetic. Day score differences are -0.10,-0.08,+0.04,+0.02, with100,10,10,10 checkpoints. Compare pooled checkpoint and equal-day means.", "back": "Pooled mean=(-10-0.8+0.4+0.2)/130=-0.0784615. Equal-day mean=(-0.10-0.08+0.04+0.02)/4=-0.03. These estimate different weighted populations. Neither is a confidence interval. The repository first aggregates within race, then reports race/day summaries to avoid giving a long race arbitrary extra influence."}, {"id": "33", "topic": "33 Bounds across scenarios", "front": "Synthetic. Scenario X gives A=[.2,.4], B=[.3,.5]; Y gives A=[.1,.6], B=[.2,.4]. What is the outer envelope and can its extremes be one outcome?", "back": "A envelope is[.1,.6] and B[.2,.5]. A maximum comes from Y, B maximum from X. Coordinatewise envelopes need not correspond to a single common scenario, much less a joint probability vector. Preserve endpoint attribution and distinguish the chosen scenario bounds from the outer assumption envelope. Do not normalize either into invented point probabilities."}, {"id": "34", "topic": "34 What would identify transfer", "front": "Research design, not measured evidence. Propose a test of AC40-to-AC75 transfer that could fail.", "back": "Collect independently attributable AC75 race-days with mappings fixed before prediction. Compare no-transfer, fixed-loading and learned partial-pooling models in event-level holdouts. Fit weights only on training events. Predeclare a proper score and a negative-transfer threshold. Failure includes no held-out gain, benefit driven by one event or uncertainty spanning nearly all plausible loadings. AC40-only frames cannot identify cross-class correlation."}, {"id": "35", "topic": "35 Defend and critique one number", "front": "Actual repository exercise. Rehearse a two-minute explanation of FRA upwind performance110.3193 in naples_pr1, then give the strongest limitation.", "back": "A good defense names the selected FRA profile, upwind course-VMG dimension, eligible matching completed legs 1 and 3, six eligible peers, source coverage548.027 s and leave-one-out peers. The raw selected aggregate16.8393 kt and peer aggregate15.2233 kt do not independently define the index, which averages leg ratios. Strong limitations include only two eligible upwind legs in one race, uncontrolled wind, routes and traffic, changing eligible peers, and descriptive rather than causal interpretation. Never translate110.3193 into a win probability."}, {"id": "36", "topic": "36 Explain the whole system", "front": "Oral synthesis, actual architecture. Explain the project to someone without sailing or forecasting knowledge in five minutes, including one falsifiable next step.", "back": "Start with recorded boat/course observations. Explain Python identity, projection, timeline, geometry and exports. Separate browser replay geometry from Python historical formulas and forecasting. Show one same-leg peer comparison and one missing value. Distinguish live win, pre-race scheduled-field expectation and multi-stage Cup bounds. Explain why tests protect implementation but small correlated race evidence limits prediction. Finish with an independent result audit or new-day baseline comparison with an explicit failure criterion."}, {"id": "37", "topic": "Race geometry", "front": "What is a gate?", "back": "A line between two course marks; the relevant sequence and direction depend on the leg."}, {"id": "38", "topic": "Tack and gybe", "front": "What distinguishes a tack from a gybe?", "back": "A tack changes wind side through the upwind direction; a gybe changes side downwind. Detected sign changes require coverage and context."}, {"id": "39", "topic": "Wind directions", "front": "What direction does meteorological wind normally denote?", "back": "The direction from which wind comes; check the owning source convention rather than assuming a velocity-vector direction."}, {"id": "40", "topic": "Window ownership", "front": "Who owns historical availability rules?", "back": "pipeline/historical_analysis.py; the browser reads exported values and metadata."}, {"id": "41", "topic": "Event clock", "front": "Why distinguish source observations and regular replay timestamps?", "back": "The regular grid is a display/processing timeline; it does not create new measurements."}, {"id": "42", "topic": "Scheduled field", "front": "Can hiding a boat reduce forecast N?", "back": "No. UI visibility and scheduled-field denominator are different concepts."}, {"id": "43", "topic": "VMG baseline", "front": "Why can wind-relative and course-axis VMG disagree?", "back": "Wind direction and course axis differ; heading and course over ground may differ too."}, {"id": "44", "topic": "Zero wind response", "front": "What does weather support prove?", "back": "Only eligibility under historical-support rules, not a nonzero learned causal response."}, {"id": "45", "topic": "Publication", "front": "What changes when the index switches?", "back": "Readers resolve a validated new immutable object; old objects remain available."}, {"id": "46", "topic": "Source scope", "front": "Is the source companion a complete operational backup?", "back": "No. It is a selected first-party reading set; raw telemetry, caches, dependencies and credentials are excluded."}, {"id": "47", "topic": "Peer votes", "front": "What receives equal weight within one eligible leg?", "back": "Each eligible other boat; not each telemetry frame or detected event pooled across boats."}, {"id": "48", "topic": "Leg votes", "front": "What receives equal weight in the dimension index?", "back": "Eligible matched leg indexes, even when leg durations differ."}, {"id": "49", "topic": "Missing crossing", "front": "Can an apparent finish supply a missing historical endpoint?", "back": "Not automatically. Preserve source chronology, quality and explicit exclusions."}, {"id": "50", "topic": "Official evidence", "front": "What does source_reconstructed mean?", "back": "A reviewed calculation from source records, with a weaker independence claim than an externally verified official result."}, {"id": "51", "topic": "Class scope", "front": "Which class is observed in the current replay archive?", "back": "AC40. AC75 Cup behavior uses transfer assumptions."}, {"id": "52", "topic": "Tactical projection", "front": "How many conditional five-minute tactical projections pass current gates?", "back": "Zero; current exports retain recorded trends and3,455 snapshots."}, {"id": "53", "topic": "Snapshot identity", "front": "Why is a commit hash insufficient here?", "back": "The working tree has modified and untracked implementation files; per-file hashes identify the reviewed bytes."}, {"id": "54", "topic": "Calibration", "front": "What is probability calibration?", "back": "Across comparable predictions near p, the event should occur at a frequency consistent with p; this needs enough independent outcomes."}, {"id": "55", "topic": "Causation", "front": "Does faster observed VMG prove a tactical choice caused the result?", "back": "No. Wind, position, crew, equipment and selection confound a descriptive comparison."}, {"id": "56", "topic": "Static service", "front": "Does file:// HTML create a Python backend?", "back": "No. Published content can be read; new generation needs the prepared local service."}, {"id": "57", "topic": "Course contact", "front": "Does enhanced boat display enlarge physical contacts?", "back": "No. Display scaling and metre-space physical contact calculations are separate."}, {"id": "58", "topic": "Scope reset", "front": "Why reset selected performance evidence when race changes?", "back": "To prevent a previous boat/leg/interval selection from being presented as current evidence."}, {"id": "59", "topic": "Nonfinish ties", "front": "Why may expected-position sums exceed N(N+1)/2?", "back": "Several nonfinishers are scored at the scheduled-field N, so scores are not a complete permutation."}, {"id": "60", "topic": "Next observation", "front": "What most directly resolves tournament-rule bounds?", "back": "Authoritative pinned rules for the unresolved path, not more Monte Carlo trials."}];let i=0;function draw(){document.querySelector('#count').textContent=(i+1)+' / '+cards.length+' · '+cards[i].topic;document.querySelector('#front').textContent=cards[i].front;document.querySelector('#back').textContent=cards[i].back;document.querySelector('#back').hidden=true}document.querySelector('#show').onclick=()=>document.querySelector('#back').hidden=false;document.querySelector('#next').onclick=()=>{i=(i+1)%cards.length;draw()};document.querySelector('#prev').onclick=()=>{i=(i+cards.length-1)%cards.length;draw()};draw();</script>
