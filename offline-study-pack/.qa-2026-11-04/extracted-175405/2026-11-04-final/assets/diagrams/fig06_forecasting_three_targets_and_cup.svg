<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#f8fafc" rx="10" stroke="#cbd5e1"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#0f172a">Figure 5.1 — Causal Forecasting Timeline &amp; 2027 America's Cup (AC38) Tournament DAG</text>
  <text x="24" y="54" font-size="12.5" fill="#475569">Top: Causal event-time reorder &amp; publication latency. Bottom: AC38 multi-stage tournament structure and the 34.46% unresolved qualification branch.</text>

  <!-- Top Panel: Causal Timeline -->
  <rect x="24" y="68" width="912" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="92" font-size="13.5" font-weight="700" fill="#0f172a">1. Causal Event-Time Reconstruction with Modeled Latency (`pipeline/prediction/source.py`)</text>

  <line x1="60" y1="135" x2="880" y2="135" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>
  <circle cx="140" cy="135" r="6" fill="#1a73e8"/>
  <text x="140" y="120" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">Raw Event t_event</text>
  <text x="140" y="156" font-size="10.5" fill="#475569" text-anchor="middle">(Out of order up to 5.85 s)</text>

  <circle cx="340" cy="135" r="6" fill="#0d9488"/>
  <text x="340" y="120" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">Closed 1 Hz Bucket</text>
  <text x="340" y="156" font-size="10.5" fill="#475569" text-anchor="middle">Consumable after second closes</text>

  <circle cx="560" cy="135" r="6" fill="#7c3aed"/>
  <text x="560" y="120" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">Checkpoint State Time t_state</text>
  <text x="560" y="156" font-size="10.5" fill="#475569" text-anchor="middle">Kalman filter (x, y, vx, vy) update</text>

  <circle cx="800" cy="135" r="7" fill="#16a34a"/>
  <text x="800" y="120" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Published Forecast t_pub = t_state + 6,000 ms</text>
  <text x="800" y="156" font-size="10.5" fill="#166534" text-anchor="middle">6.0 s Reorder &amp; Latency Buffer</text>

  <path d="M 560 128 Q 680 95 795 128" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ar)"/>
  <text x="680" y="106" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">+6,000 ms Publication Delay (`REORDER_BUFFER_MS`)</text>

  <!-- Bottom Panel: AC38 Tournament State Machine -->
  <rect x="24" y="210" width="912" height="328" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="236" font-size="13.5" font-weight="700" fill="#0f172a">2. 2027 America's Cup (`cup.py`) — Seven Entrants, Official RRSAC v5.02 Scoring &amp; Unresolved Path Bounds</text>

  <!-- Stage 1: Fleet -->
  <rect x="40" y="256" width="156" height="125" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="118" y="276" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Stage 1: 6 Fleet Races</text>
  <text x="50" y="295" font-size="10.5" fill="#334155">• 7 Teams (NZL + 6 Chall)</text>
  <text x="50" y="311" font-size="10.5" fill="#334155">• RRSAC 105.2 Points:</text>
  <text x="50" y="325" font-size="10.5" font-weight="700" fill="#1e3a8a">  10, 9, 8, 7, 6, 5, 4</text>
  <text x="50" y="341" font-size="10.5" fill="#334155">• RRSAC 107 tie-break</text>
  <text x="50" y="357" font-size="10.5" fill="#334155">• Chall Carry (Cond 5.2a):</text>
  <text x="50" y="371" font-size="10.5" font-weight="700" fill="#1e3a8a">  2.5, 2.0, 1.5, 1.0, 0.5, 0</text>

  <!-- Stage 2: Round Robins -->
  <rect x="224" y="256" width="166" height="125" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="307" y="276" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Stage 2: 3 Round Robins</text>
  <text x="234" y="295" font-size="10.5" fill="#334155">• Up to 3 complete RRs</text>
  <text x="234" y="311" font-size="10.5" fill="#334155">• Match logits concentration c</text>
  <text x="234" y="327" font-size="10.5" fill="#334155">• RRSAC 101.2: Exclude NZL</text>
  <text x="234" y="341" font-size="10.5" fill="#334155">  (Defender) results for</text>
  <text x="234" y="355" font-size="10.5" fill="#334155">  Challenger qualification</text>
  <text x="234" y="371" font-size="10.5" fill="#1e3a8a" font-weight="600">• Persistent ability per trial</text>

  <!-- Stage 3: Qualification & Repechage -->
  <rect x="418" y="256" width="176" height="125" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="506" y="276" font-size="12" font-weight="700" fill="#854d0e" text-anchor="middle">Stage 3: Qual &amp; Repechage</text>
  <text x="428" y="295" font-size="10.5" fill="#334155">• Ranks 1, 2, 3 → Semifinals</text>
  <text x="428" y="311" font-size="10.5" fill="#334155">• Rep 1: #6 vs #5 (#5 starts +1,</text>
  <text x="428" y="325" font-size="10.5" fill="#334155">  first to 3 pts)</text>
  <text x="428" y="341" font-size="10.5" fill="#334155">• Rep 2: Winner vs #4 (#4</text>
  <text x="428" y="355" font-size="10.5" fill="#334155">  starts +1, first to 3 pts)</text>
  <text x="428" y="371" font-size="10.5" font-weight="700" fill="#b91c1c">• Tie in Chall standings? ↓</text>

  <!-- Stage 4: Semifinals & Challenger Final -->
  <rect x="622" y="256" width="148" height="125" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="696" y="276" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Stage 4: CSS Knockouts</text>
  <text x="632" y="295" font-size="10.5" fill="#334155">• #1 Challenger picks SF</text>
  <text x="632" y="309" font-size="10.5" fill="#334155">  opponent (lowest observed</text>
  <text x="632" y="323" font-size="10.5" fill="#334155">  RR win fraction)</text>
  <text x="632" y="339" font-size="10.5" fill="#334155">• Semifinals: First to 5</text>
  <text x="632" y="355" font-size="10.5" fill="#334155">• Chall Final: First to 7</text>

  <!-- Stage 5: America's Cup Match -->
  <rect x="794" y="256" width="126" height="125" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="857" y="276" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="middle">Stage 5: Cup Match</text>
  <text x="804" y="298" font-size="10.5" fill="#334155">• Defender NZL vs</text>
  <text x="804" y="314" font-size="10.5" fill="#334155">  Challenger Winner</text>
  <text x="804" y="332" font-size="10.5" font-weight="700" fill="#5b21b6">• First to 7 Wins</text>
  <text x="804" y="350" font-size="10.5" fill="#334155">• Resolved Trial:</text>
  <text x="804" y="366" font-size="10.5" font-weight="700" fill="#15803d">  3,277 / 5,000 (65.54%)</text>

  <!-- Unresolved Branch Box -->
  <rect x="224" y="405" width="696" height="116" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="240" y="427" font-size="12.5" font-weight="700" fill="#991b1b">Unresolved Rule Branch (`challenger_qualification`): 1,723 / 5,000 Trials = 34.46% Unresolved Mass</text>
  <text x="240" y="446" font-size="11" fill="#7f1d1d">• Why it happens: RRSAC 102.1 specifies tie-breaking for 3- or 4-Challenger formats, leaving 6-Challenger seeding ties without a pinned deterministic rule.</text>
  <text x="240" y="464" font-size="11" fill="#7f1d1d">• How `cup.py` handles it: Refuses to invent coin-flips! Records trial as `unresolved`. For every team i with resolved wins W_i out of N = 5,000:</text>
  <text x="240" y="484" font-size="11.5" font-family="Consolas, monospace" font-weight="700" fill="#991b1b">  Lower Bound L_i = W_i / N ,   Upper Bound U_i = (W_i + U_unresolved) / N = L_i + 0.3446</text>
  <text x="240" y="504" font-size="11" fill="#7f1d1d">• Why bounds cannot be normalized: Σ L_i = 0.6554 &lt; 1 and Σ U_i = 0.6554 + 7 × 0.3446 = 3.0676 &gt; 1. Headline point `win_prob` is strictly `null`.</text>

  <!-- Stage Arrows -->
  <line x1="196" y1="318" x2="220" y2="318" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="390" y1="318" x2="414" y2="318" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="594" y1="318" x2="618" y2="318" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="770" y1="318" x2="790" y2="318" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="506" y1="381" x2="506" y2="401" stroke="#dc2626" stroke-width="2" marker-end="url(#arRed)"/>
</svg>