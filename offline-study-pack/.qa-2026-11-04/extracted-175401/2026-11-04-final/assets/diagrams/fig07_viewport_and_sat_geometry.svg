<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="480" fill="#f8fafc" rx="10" stroke="#cbd5e1"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#0f172a">Figure 6.1 — Yacht Polygon Geometry, SAT Contact Overlaps &amp; Viewport Transformations</text>
  <text x="24" y="54" font-size="12.5" fill="#475569">Left: AC40 metre-space hull, foils, and Keep Clear envelope relative to transom GNSS. Right: World-to-screen pipelines in Grid vs. Map mode.</text>

  <!-- Left Panel: AC40 Local Geometry -->
  <rect x="24" y="72" width="440" height="384" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="42" y="98" font-size="14" font-weight="700" fill="#0f172a">1. AC40 Yacht-Local Metre Geometry (`boatModels.ts`)</text>

  <!-- Keep Clear octagon / envelope -->
  <polygon points="244,120 330,175 330,355 244,395 158,355 158,175" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="336" y="185" font-size="11" font-weight="700" fill="#b91c1c">Keep Clear Border</text>
  <text x="336" y="200" font-size="10.5" fill="#7f1d1d">(2 m buffer around Platform)</text>

  <!-- Platform envelope -->
  <polygon points="244,142 308,190 308,340 244,372 180,340 180,190" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="172" y="190" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="end">Platform Envelope</text>

  <!-- Foil arms -->
  <line x1="180" y1="255" x2="308" y2="255" stroke="#334155" stroke-width="5"/>
  <circle cx="180" cy="255" r="4" fill="#0f172a"/>
  <circle cx="308" cy="255" r="4" fill="#0f172a"/>
  <text x="170" y="259" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="end">Port Foil (−5.415 m)</text>
  <text x="318" y="259" font-size="10.5" font-weight="700" fill="#0f172a">Stbd Foil (+5.415 m)</text>

  <!-- Hull polygon -->
  <polygon points="244,142 258,210 260,348 228,348 230,210" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2.5"/>
  <!-- Transom GNSS Origin (0,0) -->
  <circle cx="244" cy="344" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <text x="256" y="348" font-size="11" font-weight="700" fill="#991b1b">GNSS Origin (0, 0)</text>
  <text x="256" y="363" font-size="10.5" fill="#7f1d1d">Aft overhang: −0.215 m</text>

  <!-- Bow Tip (+12.963 m) -->
  <circle cx="244" cy="142" r="5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
  <text x="244" y="132" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Bow Tip (+12.963 m)</text>

  <rect x="42" y="404" width="404" height="40" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="421" font-size="10.5" fill="#334155"><tspan font-weight="700">Crucial Invariant:</tspan> Enhanced display scaling (`minPx = 30`) enlarges screen pixels</text>
  <text x="52" y="435" font-size="10.5" fill="#334155">uniformly, while SAT contact detection always runs in unscaled world metres!</text>

  <!-- Right Panel: Grid vs Map Viewport Transforms -->
  <rect x="484" y="72" width="452" height="384" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="502" y="98" font-size="14" font-weight="700" fill="#0f172a">2. World-to-Screen Coordinate Pipelines (`CourseCanvas.tsx`)</text>

  <rect x="502" y="114" width="416" height="106" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="514" y="134" font-size="12" font-weight="700" fill="#166534">Path A: Offline Grid Mode (`ViewportMatrix.ts`) — Zero Network Requests</text>
  <text x="514" y="154" font-size="11" font-family="Consolas, monospace" fill="#14532d">dx = x − center.x ,   dy = y − center.y</text>
  <text x="514" y="172" font-size="11" font-family="Consolas, monospace" fill="#14532d">u_screen = W/2 + scale · (dx cos β − dy sin β)</text>
  <text x="514" y="190" font-size="11" font-family="Consolas, monospace" fill="#14532d">v_screen = H/2 − scale · (dx sin β + dy cos β)</text>
  <text x="514" y="208" font-size="10.5" fill="#15803d">Paints pale water (#e8f1f8), 250 m world grid, active boundaries, and vessels.</text>

  <rect x="502" y="232" width="416" height="114" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="514" y="252" font-size="12" font-weight="700" fill="#1e40af">Path B: Geographic Map Mode (`geoProjection.ts` + MapLibre)</text>
  <text x="514" y="272" font-size="11" font-family="Consolas, monospace" fill="#1e3a8a">lon = origin.lon + x / k_lon ,   lat = origin.lat + y / k_lat</text>
  <text x="514" y="290" font-size="11" fill="#1e3a8a">• Samples MapLibre camera at origin &amp; basis offsets (+100 m East, +100 m North)</text>
  <text x="514" y="308" font-size="11" fill="#1e3a8a">  to fit an exact local 2D affine matrix (Max Mercator error &lt; 0.20 px across course).</text>
  <text x="514" y="326" font-size="10.5" fill="#1d4ed8">• Requires OpenStreetMap raster tiles when online; retains OSM attribution.</text>

  <rect x="502" y="358" width="416" height="84" rx="6" fill="#faf5ff" stroke="#8b5cf6"/>
  <text x="514" y="378" font-size="12" font-weight="700" fill="#5b21b6">Camera Continuity Across Mode Switches (`cameraStateSync`)</text>
  <text x="514" y="396" font-size="11" fill="#4c1d95">Switching Grid ↔ Map preserves exact world centre `(x, y)` and metric scale</text>
  <text x="514" y="412" font-size="11" fill="#4c1d95">(`px/m`), deriving MapLibre zoom from the current viewport dimensions rather</text>
  <text x="514" y="428" font-size="11" fill="#4c1d95">than a stale cached zoom level.</text>
</svg>