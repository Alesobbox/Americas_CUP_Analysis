<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="aB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1a73e8"/>
    </marker>
    <marker id="aG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="aR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#f8fafc" rx="10" stroke="#cbd5e1"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#0f172a">Figure 3.1 — Reconstruction Mechanics: Bow Segment Intersection, Angle Wrap &amp; Telemetry Gaps</text>

  <!-- Panel A: Bow Segment Intersection -->
  <rect x="24" y="54" width="300" height="442" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="38" y="78" font-size="13.5" font-weight="700" fill="#0f172a">A. Sub-Frame Bow Line Crossing</text>
  <text x="38" y="96" font-size="11" fill="#475569">GNSS is at transom; bow is +12.963 m along ψ.</text>

  <!-- Gate Line M_P to M_S -->
  <line x1="54" y1="220" x2="294" y2="220" stroke="#dc2626" stroke-width="3" stroke-dasharray="6,3"/>
  <circle cx="54" cy="220" r="6" fill="#dc2626"/>
  <circle cx="294" cy="220" r="6" fill="#dc2626"/>
  <text x="54" y="206" font-size="11" font-weight="700" fill="#991b1b">M_P (u=0)</text>
  <text x="294" y="206" font-size="11" font-weight="700" fill="#991b1b" text-anchor="end">M_S (u=1)</text>

  <!-- Frame k (t_k) -->
  <circle cx="130" cy="360" r="5" fill="#64748b"/>
  <text x="120" y="376" font-size="10.5" fill="#475569" text-anchor="end">GNSS p(t_k)</text>
  <line x1="130" y1="360" x2="155" y2="265" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#aB)"/>
  <circle cx="155" cy="265" r="5" fill="#1a73e8"/>
  <text x="145" y="262" font-size="10.5" font-weight="700" fill="#1e40af" text-anchor="end">Bow b(t_k)</text>

  <!-- Frame k+1 (t_{k+1}) -->
  <circle cx="175" cy="270" r="5" fill="#64748b"/>
  <text x="185" y="274" font-size="10.5" fill="#475569">GNSS p(t_{k+1})</text>
  <line x1="175" y1="270" x2="200" y2="175" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#aB)"/>
  <circle cx="200" cy="175" r="5" fill="#1a73e8"/>
  <text x="210" y="178" font-size="10.5" font-weight="700" fill="#1e40af">Bow b(t_{k+1})</text>

  <!-- Bow trajectory segment -->
  <line x1="155" y1="265" x2="200" y2="175" stroke="#16a34a" stroke-width="3" marker-end="url(#aG)"/>
  <!-- Intersection point -->
  <circle cx="177.5" cy="220" r="7" fill="#facc15" stroke="#16a34a" stroke-width="2.5"/>
  <text x="188" y="238" font-size="11" font-weight="700" fill="#15803d">Crossing (α*, u*)</text>

  <rect x="38" y="395" width="272" height="88" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="414" font-size="11" font-weight="700" fill="#0f172a">Exact Sub-Frame Equations:</text>
  <text x="48" y="432" font-size="10.5" fill="#334155">b(t) = p(t) + 12.963 · [sin ψ(t), cos ψ(t)]ᵀ</text>
  <text x="48" y="448" font-size="10.5" fill="#334155">t_cross = t_k + α* · (t_{k+1} − t_k),  α* ∈ [0, 1]</text>
  <text x="48" y="464" font-size="10.5" fill="#334155">Notice: GNSS p(t_{k+1}) has NOT crossed yet,</text>
  <text x="48" y="478" font-size="10.5" fill="#15803d" font-weight="600">but the bow b(t) crossed at α* = 0.50!</text>

  <!-- Panel B: Shortest-Arc Circular Interpolation -->
  <rect x="336" y="54" width="290" height="442" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="350" y="78" font-size="13.5" font-weight="700" fill="#0f172a">B. Circular Angle Wraparound (0°/360°)</text>
  <text x="350" y="96" font-size="11" fill="#475569">Interpolating θ₀ = 358° to θ₁ = 2° at midpoint α = 0.5</text>

  <circle cx="481" cy="235" r="95" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <line x1="481" y1="235" x2="481" y2="128" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="481" y="122" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">0° / 360° (North)</text>
  <text x="481" y="348" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">180° (Naive Linear Midpoint!)</text>

  <!-- Vector 358 deg -->
  <line x1="481" y1="235" x2="466" y2="142" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#aB)"/>
  <text x="455" y="146" font-size="11" font-weight="700" fill="#1e40af" text-anchor="end">θ₀ = 358°</text>

  <!-- Vector 2 deg -->
  <line x1="481" y1="235" x2="496" y2="142" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#aB)"/>
  <text x="507" y="146" font-size="11" font-weight="700" fill="#1e40af">θ₁ = 2°</text>

  <!-- Shortest arc (+4 deg across North) -->
  <path d="M 468 150 Q 481 146 494 150" fill="none" stroke="#16a34a" stroke-width="3.5" marker-end="url(#aG)"/>
  <text x="515" y="172" font-size="11" font-weight="700" fill="#15803d">Shortest Arc: Δθ = +4° → 0°</text>

  <!-- Wrong linear arc (through 180 deg) -->
  <path d="M 450 235 A 31 31 0 1 0 512 235" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#aR)"/>
  <text x="481" y="282" font-size="10.5" font-weight="600" fill="#b91c1c" text-anchor="middle">Wrong: (358+2)/2 = 180°</text>

  <rect x="350" y="395" width="262" height="88" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="414" font-size="11" font-weight="700" fill="#0f172a">Shortest-Arc Formula (`ingest.py`):</text>
  <text x="360" y="432" font-size="10.5" fill="#334155">Δθ = ((θ₁ − θ₀ + 180) mod 360) − 180</text>
  <text x="360" y="448" font-size="10.5" fill="#334155">θ(α) = (θ₀ + α · Δθ) mod 360</text>
  <text x="360" y="464" font-size="10.5" fill="#334155">Circular Mean (`reference_twd_deg`):</text>
  <text x="360" y="478" font-size="10.5" fill="#15803d" font-weight="600">atan2(Σ sin θ_i, Σ cos θ_i) mod 360</text>

  <!-- Panel C: Telemetry Gaps vs Held Values -->
  <rect x="638" y="54" width="298" height="442" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="652" y="78" font-size="13.5" font-weight="700" fill="#0f172a">C. Gaps &amp; Held Values (`naples_pr1`)</text>
  <text x="652" y="96" font-size="11" fill="#475569">Why coverage must be checked on raw timestamps.</text>

  <!-- Case 1: NZL G 74.60s internal dropout -->
  <text x="652" y="126" font-size="11.5" font-weight="700" fill="#0f172a">1. NZL G Internal Dropout (74.60 s gap)</text>
  <line x1="652" y1="165" x2="720" y2="150" stroke="#16a34a" stroke-width="3"/>
  <line x1="720" y1="150" x2="845" y2="185" stroke="#d97706" stroke-width="2.5" stroke-dasharray="5,3"/>
  <line x1="845" y1="185" x2="916" y2="160" stroke="#16a34a" stroke-width="3"/>
  <circle cx="720" cy="150" r="4.5" fill="#16a34a"/>
  <circle cx="845" cy="185" r="4.5" fill="#16a34a"/>
  <rect x="722" y="135" width="121" height="65" fill="#fef3c7" fill-opacity="0.45" stroke="#f59e0b" stroke-dasharray="3,3"/>
  <text x="782" y="214" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="middle">12:32:32.5 → 12:33:47.1 (74.6 s &gt; 2.0 s)</text>
  <text x="652" y="232" font-size="10.5" fill="#334155">• Replay grid: bridges linearly across gap.</text>
  <text x="652" y="247" font-size="10.5" fill="#b91c1c" font-weight="600">• Historical analysis: rejects interval (&gt;2.0 s)!</text>

  <!-- Case 2: GBR B Post-Last Held Tail -->
  <text x="652" y="282" font-size="11.5" font-weight="700" fill="#0f172a">2. GBR B Post-Retirement Held Tail (951.55 s)</text>
  <line x1="652" y1="330" x2="755" y2="305" stroke="#16a34a" stroke-width="3"/>
  <line x1="755" y1="305" x2="916" y2="305" stroke="#dc2626" stroke-width="3" stroke-dasharray="6,3"/>
  <circle cx="755" cy="305" r="5" fill="#dc2626"/>
  <text x="755" y="295" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Last Sample 12:23:37.150</text>
  <text x="835" y="324" font-size="10.5" font-weight="700" fill="#991b1b" text-anchor="middle">Held Constant for 15m 51.55s</text>
  <text x="652" y="352" font-size="10.5" fill="#334155">• Replay resampler holds last value to window end.</text>
  <text x="652" y="367" font-size="10.5" fill="#b91c1c" font-weight="600">• Naive reader would see 15.8 min of constant SOG!</text>

  <rect x="652" y="395" width="270" height="88" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="662" y="414" font-size="11" font-weight="700" fill="#991b1b">Coverage Contract (`historical_analysis.py`):</text>
  <text x="662" y="432" font-size="10.5" fill="#7f1d1d">A frame t is valid iff t ∈ [t_first, t_last] AND</text>
  <text x="662" y="448" font-size="10.5" fill="#7f1d1d">lies inside a consecutive raw sample pair</text>
  <text x="662" y="464" font-size="10.5" fill="#7f1d1d">with Δt_raw = t_{m+1} − t_m ≤ 2,000 ms.</text>
  <text x="662" y="478" font-size="10.5" font-weight="700" fill="#991b1b">Quality `derived` requires coverage ≥ 95%.</text>
</svg>