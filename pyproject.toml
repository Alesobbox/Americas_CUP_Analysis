[project]
name = "regatta-forecast"
version = "0.1.0"
description = "Causal evidence-gated regatta probability pipeline"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
forecast-core = ["numpy>=2.2,<3", "scipy>=1.15,<2", "pyarrow>=20,<24"]
forecast-ml = ["scikit-learn>=1.6,<2", "catboost>=1.2.8,<2"]
forecast-neural = ["torch>=2.2,<3"]
environment = [
    "cftime>=1.6.6.1",
    "copernicusmarine>=2.5.1",
    "netcdf4>=1.7.5.1.post1",
    "xarray>=2026.9.0",
]

[tool.uv]
package = false
