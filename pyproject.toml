[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ac40-regatta-replay"
version = "0.1.0"
description = "America's Cup 38th Preliminary Regatta telemetry pipeline and 2D tactical replay"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
pipeline = [
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "pyarrow>=20,<24",
]
environment = [
    "cftime>=1.6.6.1",
    "copernicusmarine>=2.5.1",
    "h5netcdf>=1.6",
    "netcdf4>=1.7.5.1.post1",
    "xarray>=2026.9.0",
]
dev = [
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
include = ["pipeline*", "scripts*"]

[tool.uv]
package = false
