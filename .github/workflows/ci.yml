name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python pipeline and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pipeline,environment,dev]" || python -m pip install numpy scipy pyarrow xarray h5netcdf cftime netcdf4 ruff

      - name: Run full CI verification
        run: python scripts/verify.py --with-format
